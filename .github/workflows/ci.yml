name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y ripgrep clangd
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --bins --locked
      - run: python3 -m pip install -r tests/requirements.txt
      - run: python3 tests/pty_regression.py target/release/vaayu
      - run: python3 tests/pty_regression.py target/release/vy
      - run: python3 tests/pty_extended.py target/release/vaayu
      - run: python3 tests/pty_extended.py target/release/vy
      - run: python3 tests/pty_ui.py target/release/vaayu
      - run: python3 tests/pty_typing_ui.py target/release/vaayu
      - run: cargo test real_clangd_formatting_and_diagnostics -- --ignored
