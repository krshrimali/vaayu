# Copy to ~/.config/vaayu/config.toml. Commands are argv arrays, never shell strings.
leader = ","
# tabstop/shiftwidth/expandtab are the deterministic fallback used only when
# a file has no Vim modeline and no applicable .editorconfig entry, and its
# own content gives no heuristic hint either. Each open buffer resolves its
# own effective values independently -- see :indentinfo.
tabstop = 4
shiftwidth = 4
expandtab = true
number = true
relativenumber = false
scrolloff = 8
wrap = true
# Marker shown in the gutter of soft-wrapped continuation rows (Vim's
# `showbreak`). Empty (the default) shows nothing; set e.g. "↪" or "> " to
# mark wrapped lines. Only applies when `wrap = true`.
showbreak = ""
jk_escape = true
timeoutlen_ms = 300
whichkey_delay_ms = 500
autopairs = true
completion_enabled = true
# Delay (ms) before the completion popup appears after a keystroke; 0
# shows it instantly. Candidates are computed either way -- this only
# gates when the popup is painted, so a fast typist doesn't see it
# flash in and out on every keystroke.
completion_delay_ms = 0
ignorecase = true
smartcase = true
clipboard_unnamedplus = true

# On-save hooks (opt-in; default false). Applied on :w before the bytes are
# written, as one undo step.
trim_trailing_whitespace = false   # strip trailing spaces/tabs from every line
insert_final_newline = false       # ensure a non-empty file ends with one "\n"

# Declarative autocommands: run an Ex command when an event fires on a buffer
# whose name matches the glob `pattern` (default "*"; matches basename or path).
# Events: BufWritePre, BufWritePost, BufEnter, InsertLeave (FocusGained,
# CursorHold, FileType are reserved). Example: uppercase-less formatting hook.
# [[autocmd]]
# event = "BufWritePre"
# pattern = "*.rs"
# command = "s/\\s\\+$//"

# User key remaps. mode is any combination of n/i/v. lhs is a single key or a
# <leader>-sequence; rhs is either keys to replay (noremap) or an Ex command when
# it starts with ":". Notation: <leader>, <C-x>, <CR>, <Esc>, <Tab>, <BS>,
# <Space>, arrows, <lt>.
# [[keymap]]
# mode = "n"
# lhs = "Y"
# rhs = "y$"
# [[keymap]]
# mode = "n"
# lhs = "<leader>w"
# rhs = ":w<CR>"

# Optional agent handoff. These are top-level options and therefore belong
# before the first [lsp.*] table. The executable receives a version-1 JSON
# review packet on stdin and writes its report to stdout. No shell is used.
# review_command = ["/absolute/path/to/review-agent", "--read-stdin"]
# review_timeout_secs = 300

# Named servers may share filetypes. Defaults apply only when no configuration
# matches a filetype. enabled=false disables a matching server.
[lsp.rust_analyzer]
cmd = ["rust-analyzer"]
filetypes = ["rust"]
root_markers = ["Cargo.toml", ".git"]
[lsp.rust_analyzer.settings.rust-analyzer]
cargo.allFeatures = true
completion.autoimport.enable = true
check.command = "check"

[lsp.clangd]
cmd = ["clangd", "--background-index", "--clang-tidy", "--header-insertion=iwyu", "--completion-style=detailed", "--fallback-style=llvm"]
filetypes = ["c", "cpp"]
root_markers = [".clangd", "compile_commands.json", "compile_flags.txt", ".git"]

[lsp.ruff]
cmd = ["ruff", "server"]
filetypes = ["python"]
root_markers = ["pyproject.toml", "setup.py", ".git"]
[lsp.ruff.init_options.settings]
args = ["--line-length=88"]

[lsp.ty]
cmd = ["ty", "server"]
filetypes = ["python"]
root_markers = ["pyproject.toml", "setup.py", "setup.cfg", ".git"]

[lsp.ts_ls]
cmd = ["typescript-language-server", "--stdio"]
filetypes = ["typescript", "typescriptreact", "javascript", "javascriptreact"]
root_markers = ["tsconfig.json", "package.json", ".git"]
[lsp.ts_ls.settings.typescript]
suggest.autoImports = true
inlayHints.includeInlayParameterNameHints = "none"
[lsp.ts_ls.settings.javascript]
suggest.autoImports = true

[lsp.gopls]
cmd = ["gopls"]
filetypes = ["go"]
root_markers = ["go.work", "go.mod", ".git"]
[lsp.gopls.settings.gopls]
analyses.unusedparams = true
staticcheck = true
gofumpt = true

[lsp.lua_ls]
cmd = ["lua-language-server"]
filetypes = ["lua"]
root_markers = [".luarc.json", ".git"]
[lsp.lua_ls.settings.Lua]
runtime.version = "LuaJIT"
diagnostics.globals = ["vim"]
workspace.checkThirdParty = false
workspace.maxPreload = 1000
telemetry.enable = false

# Environment and client capability overrides are optional:
# [lsp.clangd.env]
# CUSTOM_VARIABLE = "value"
# [lsp.clangd.capabilities.textDocument.completion.completionItem]
# documentationFormat = ["plaintext"]

# Under an individual [lsp.NAME] table, request_timeout_ms = 15000 controls
# both initialization and request deadlines (clamped to 100..300000 ms).
